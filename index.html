<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEXA Market — Преміальний маркетплейс брендових речей</title>
  <meta name="description" content="Купуйте та продавайте брендовий одяг, взуття, аксесуари. Безпечна угода Нова Пошта.">
  <meta name="google-site-verification" content="efadf3afaf6728bb" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client (стабильная версия) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Подключение к Supabase
    const SUPABASE_URL = 'https://qvhufbeqgjzptqapniyt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_h4aHclSSvA8PvQVKIEOipw_-itHcvUc';
    
    let supabase = null;
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.error('Помилка підключення до Supabase:', e);
    }

    const ADMIN_PASSCODE = '2026';

    const CATEGORIES = [
      { id: 'all', name: 'Всі' },
      { id: 'clothes', name: 'Одяг' },
      { id: 'shoes', name: 'Взуття' },
      { id: 'outerwear', name: 'Верхній одяг' },
      { id: 'perfume', name: 'Парфумерія' },
      { id: 'auto', name: 'Автотовари' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('all');
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);

      const [isSellModalOpen, setIsSellModalOpen] = useState(false);
      const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);

      // Форма добавления
      const [title, setTitle] = useState('');
      const [price, setPrice] = useState('');
      const [category, setCategory] = useState('outerwear');
      const [imageUrl, setImageUrl] = useState('');
      const [description, setDescription] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      // Админка
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [adminPassInput, setAdminPassInput] = useState('');
      const [commissionRate, setCommissionRate] = useState(7);
      const [vipPrice, setVipPrice] = useState(150);

      useEffect(() => {
        loadData();
      }, []);

      async function loadData() {
        setLoading(true);
        if (!supabase) {
          setLoading(false);
          return;
        }
        try {
          const { data, error } = await supabase
            .from('products')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && data) {
            setItems(data);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      }

      async function handleCreateProduct(e) {
        e.preventDefault();
        if (!title || !price) {
          alert('Вкажіть назву та ціну');
          return;
        }

        setIsSubmitting(true);
        const fallbackImg = 'https://images.unsplash.com/photo-1544441893-675973e31985?w=800&auto=format&fit=crop&q=80';
        const newProduct = {
          title: title.trim(),
          price: Number(price),
          category: category,
          image_url: imageUrl.trim() || fallbackImg,
          description: description.trim(),
          status: 'available'
        };

        if (supabase) {
          try {
            const { data, error } = await supabase
              .from('products')
              .insert([newProduct])
              .select();

            if (!error && data && data[0]) {
              setItems([data[0], ...items]);
            }
          } catch (err) {
            alert('Помилка: ' + err.message);
          }
        }

        setTitle('');
        setPrice('');
        setImageUrl('');
        setDescription('');
        setIsSellModalOpen(false);
        setIsSubmitting(false);
      }

      function handleAdminLogin(e) {
        e.preventDefault();
        if (adminPassInput === ADMIN_PASSCODE) {
          setIsAdminAuthenticated(true);
        } else {
          alert('Невірний пароль!');
          setAdminPassInput('');
        }
      }

      const filteredItems = activeTab === 'all' 
        ? items 
        : items.filter(it => it.category === activeTab);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <header className="border-b border-neutral-900 bg-neutral-950/80 backdrop-blur sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
                  VEXA MARKET
                </span>
                <span className="text-[10px] px-2 py-0.5 rounded-full bg-neutral-900 border border-neutral-800 text-neutral-400">
                  SECURE RESALE
                </span>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsAdminModalOpen(true)}
                  className="px-3.5 py-1.5 rounded-xl border border-neutral-800 text-xs text-neutral-400 hover:text-white hover:bg-neutral-900 transition"
                >
                  Кабінет власника
                </button>
                <button
                  onClick={() => setIsSellModalOpen(true)}
                  className="px-4 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-semibold text-xs transition"
                >
                  + Продати річ
                </button>
              </div>
            </div>

            <div className="max-w-6xl mx-auto px-4 flex gap-2 overflow-x-auto pb-3 pt-1">
              {CATEGORIES.map(cat => (
                <button
                  key={cat.id}
                  onClick={() => setActiveTab(cat.id)}
                  className={`px-3.5 py-1 rounded-full text-xs font-medium whitespace-nowrap transition ${
                    activeTab === cat.id
                      ? 'bg-neutral-100 text-neutral-950'
                      : 'bg-neutral-900/60 text-neutral-400 hover:text-white border border-neutral-800'
                  }`}
                >
                  {cat.name}
                </button>
              ))}
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
            <div className="flex items-center justify-between mb-6">
              <h1 className="text-lg font-bold">Останні пропозиції</h1>
              <span className="text-xs text-neutral-500">Товарів: {items.length}</span>
            </div>

            {loading ? (
              <div className="py-24 text-center text-neutral-500 text-sm">
                Завантаження товарів із бази...
              </div>
            ) : filteredItems.length === 0 ? (
              <div className="py-24 text-center border border-dashed border-neutral-800 rounded-2xl p-8">
                <p className="text-neutral-400 text-sm mb-4">У цій категорії поки що немає товарів</p>
                <button
                  onClick={() => setIsSellModalOpen(true)}
                  className="px-4 py-2 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-xs font-medium"
                >
                  Додати першу річ
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                {filteredItems.map(item => (
                  <div
                    key={item.id}
                    onClick={() => setSelectedItem(item)}
                    className="group bg-neutral-900/40 border border-neutral-900 hover:border-neutral-700 rounded-2xl overflow-hidden cursor-pointer transition flex flex-col justify-between"
                  >
                    <div className="aspect-square bg-neutral-950 overflow-hidden relative">
                      <img
                        src={item.image_url || 'https://images.unsplash.com/photo-1544441893-675973e31985?w=800&auto=format&fit=crop&q=80'}
                        alt={item.title}
                        className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                        onError={(e) => {
                          e.target.src = 'https://images.unsplash.com/photo-1544441893-675973e31985?w=800&auto=format&fit=crop&q=80';
                        }}
                      />
                      <span className="absolute top-2.5 right-2.5 bg-neutral-950/80 backdrop-blur px-2 py-0.5 rounded-full text-[10px] text-neutral-300 border border-neutral-800">
                        {item.category}
                      </span>
                    </div>
                    <div className="p-3.5">
                      <h3 className="text-xs font-medium text-neutral-200 line-clamp-1 mb-1.5">{item.title}</h3>
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-bold text-emerald-400">
                          {Number(item.price).toLocaleString()} ₴
                        </span>
                        <span className="text-[10px] text-neutral-500">Безпечна угода</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {isSellModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 w-full max-w-md rounded-2xl p-6 relative">
                <button
                  onClick={() => setIsSellModalOpen(false)}
                  className="absolute top-4 right-4 text-neutral-400 hover:text-white text-lg"
                >
                  ✕
                </button>
                <h2 className="text-base font-bold mb-4">Виставити річ на продаж</h2>

                <form onSubmit={handleCreateProduct} className="space-y-3.5">
                  <div>
                    <label className="block text-[11px] text-neutral-400 mb-1">Назва товару</label>
                    <input
                      type="text"
                      required
                      placeholder="Пуховик / Кросівки"
                      value={title}
                      onChange={e => setTitle(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-neutral-950 border border-neutral-800 text-xs focus:border-emerald-500 outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] text-neutral-400 mb-1">Ціна (₴)</label>
                      <input
                        type="number"
                        required
                        placeholder="3500"
                        value={price}
                        onChange={e => setPrice(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-neutral-950 border border-neutral-800 text-xs focus:border-emerald-500 outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] text-neutral-400 mb-1">Категорія</label>
                      <select
                        value={category}
                        onChange={e => setCategory(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-neutral-950 border border-neutral-800 text-xs focus:border-emerald-500 outline-none text-neutral-300"
                      >
                        <option value="outerwear">Верхній одяг</option>
                        <option value="clothes">Одяг</option>
                        <option value="shoes">Взуття</option>
                        <option value="perfume">Парфумерія</option>
                        <option value="auto">Автотовари</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] text-neutral-400 mb-1">Посилання на фото (URL)</label>
                    <input
                      type="url"
                      placeholder="https://..."
                      value={imageUrl}
                      onChange={e => setImageUrl(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-neutral-950 border border-neutral-800 text-xs focus:border-emerald-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] text-neutral-400 mb-1">Опис товару</label>
                    <textarea
                      rows="2"
                      placeholder="Стан, розмір..."
                      value={description}
                      onChange={e => setDescription(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-neutral-950 border border-neutral-800 text-xs focus:border-emerald-500 outline-none resize-none"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold text-xs transition mt-2 disabled:opacity-50"
                  >
                    {isSubmitting ? 'Публікація...' : 'Опублікувати'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {selectedItem && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 w-full max-w-sm rounded-2xl p-6 relative">
                <button
                  onClick={() => setSelectedItem(null)}
                  className="absolute top-4 right-4 text-neutral-400 hover:text-white text-lg"
                >
                  ✕
                </button>
                <div className="aspect-square bg-neutral-950 rounded-xl overflow-hidden mb-4">
                  <img
                    src={selectedItem.image_url}
                    alt={selectedItem.title}
                    className="w-full h-full object-cover"
                  />
                </div>
                <h3 className="text-base font-bold mb-1">{selectedItem.title}</h3>
                <p className="text-xs text-neutral-400 mb-4">{selectedItem.description}</p>
                <button
                  onClick={() => {
                    alert('Замовлення оформлено через Безпечну Угоду!');
                    setSelectedItem(null);
                  }}
                  className="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-extrabold text-xs transition"
                >
                  Оплатити ({Number(selectedItem.price).toLocaleString()} ₴)
                </button>
              </div>
            </div>
          )}

          {isAdminModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 w-full max-w-xl rounded-2xl p-6 relative">
                <button
                  onClick={() => setIsAdminModalOpen(false)}
                  className="absolute top-4 right-4 text-neutral-400 hover:text-white text-lg"
                >
                  ✕
                </button>

                {!isAdminAuthenticated ? (
                  <form onSubmit={handleAdminLogin} className="space-y-4 max-w-xs mx-auto py-6 text-center">
                    <h3 className="text-base font-bold">Вхід у кабінет власника</h3>
                    <input
                      type="password"
                      placeholder="Введіть PIN (2026)"
                      value={adminPassInput}
                      onChange={e => setAdminPassInput(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-neutral-950 border border-neutral-800 text-center text-sm outline-none focus:border-emerald-500"
                    />
                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold text-xs"
                    >
                      Підтвердити
                    </button>
                  </form>
                ) : (
                  <div>
                    <h2 className="text-base font-bold mb-1">Панель власника платформи</h2>
                    <p className="text-xs text-neutral-400 mb-6">Керування комісіями сайту та прибутком</p>
                    <div className="grid grid-cols-3 gap-3 mb-6">
                      <div className="bg-neutral-950 p-3 rounded-xl border border-neutral-800">
                        <span className="text-[10px] text-neutral-400 block mb-1">Зароблено</span>
                        <span className="text-lg font-extrabold text-emerald-400">1 850 ₴</span>
                      </div>
                      <div className="bg-neutral-950 p-3 rounded-xl border border-neutral-800">
                        <span className="text-[10px] text-neutral-400 block mb-1">Ставка</span>
                        <span className="text-lg font-extrabold text-white">{commissionRate}%</span>
                      </div>
                      <div className="bg-neutral-950 p-3 rounded-xl border border-neutral-800">
                        <span className="text-[10px] text-neutral-400 block mb-1">VIP-просування</span>
                        <span className="text-lg font-extrabold text-amber-400">{vipPrice} ₴</span>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          <footer className="border-t border-neutral-900 bg-neutral-950 py-8 text-center text-xs text-neutral-500">
            © 2026 VEXA Market. Усі права захищено. Безпечний сервіс оголошень та ресейлу.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
